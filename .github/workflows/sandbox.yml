# SPDX-License-Identifier: Apache-2.0
name: Prototype - macOS sandbox

on:
  push:
    branches:
      - main
    paths:
      - prototypes/macos-sandbox/**
      - .github/workflows/sandbox.yml
  pull_request:
    paths:
      - prototypes/macos-sandbox/**
      - .github/workflows/sandbox.yml

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Sandbox tests
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Test the sandbox and command detection
        working-directory: prototypes/macos-sandbox
        run: node --test 'test/*.test.mjs'

  corpus:
    name: Public projects in the sandbox
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
          cache: false

      - name: Show the toolchains
        run: |
          sw_vers
          node --version
          python3 --version
          go version
          cargo --version

      - name: Run the projects' tests
        run: node prototypes/macos-sandbox/corpus.mjs "${RUNNER_TEMP}/corpus" "${RUNNER_TEMP}/results"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sandbox-corpus-results
          path: ${{ runner.temp }}/results
