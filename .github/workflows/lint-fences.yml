# SPDX-License-Identifier: Apache-2.0
name: Lint - fences

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited

permissions: {}

jobs:
  fences:
    name: Fences
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test the fence check
        run: python3 -I -B -m unittest discover --start-directory dev --pattern 'test_*.py'

      - name: Fetch VSCodium's master
        run: git fetch --quiet --no-tags https://github.com/VSCodium/vscodium.git master:refs/vscodium/master

      - name: Check that Planish's edits to upstream files are fenced
        run: python3 -I dev/check_fences.py refs/vscodium/master
